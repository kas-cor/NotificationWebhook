plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'jacoco'
}

android {
    namespace 'com.notifwebhook'
    compileSdk 34

    defaultConfig {
        applicationId "com.notifwebhook"
        minSdk 34          // Android 14+ only
        targetSdk 34
        versionCode 4
        versionName "1.5.2"
    }

    def keystoreFile = rootProject.file('notwebhook-release.jks')

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
                keyAlias 'notwebhook'
                keyPassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        debug {
            enableUnitTestCoverage true
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    testOptions {
        unitTests {
            // Нужно для Robolectric (Compose UI-тесты)
            includeAndroidResources true
        }
    }



    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        // Совместим с Kotlin 1.9.22 (см. таблицу совместимости Compose Compiler)
        kotlinCompilerExtensionVersion = '1.5.8'
    }
}

jacoco {
    toolVersion = '0.8.11'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // XML-тема (Theme.Material3.DayNight) для окна Activity
    implementation 'com.google.android.material:material:1.12.0'
    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.04.01')
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    // Real org.json implementation for unit tests (Android provides stubs)
    testImplementation 'org.json:json:20231013'

    // Compose UI tests on the JVM (Robolectric), run via ./gradlew test
    testImplementation composeBom
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.13'
    // Регистрирует ComponentActivity для createComposeRule в debug-манифесте
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// Compose UI-тесты (Robolectric) работают только с debug-манифестом:
// ui-test-manifest добавлен как debugImplementation, поэтому в release-варианте
// для createComposeRule нет ComponentActivity. Запускаем их только в debug.
afterEvaluate {
    tasks.named('testReleaseUnitTest') {
        filter {
            excludeTestsMatching 'com.notifwebhook.MainScreenUiTest'
        }
    }
}

// --- JaCoCo coverage report task ---
tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
    }

    // Kotlin source files
    sourceDirectories.setFrom(files(layout.projectDirectory.dir("src/main/kotlin")))

    // Compiled class files (Kotlin + Java) — production + tests, exclude auto-generated
    classDirectories.setFrom(
        // Production code
        fileTree(layout.buildDirectory.dir("tmp/kotlin-classes/debug")) {
            include '**/*.class'
            exclude '**/R.class'
            exclude '**/R$*.class'
            exclude '**/BuildConfig.class'
        },
        // Test code
        fileTree(layout.buildDirectory.dir("tmp/kotlin-classes/debugUnitTest")) {
            include '**/*.class'
            exclude '**/R.class'
            exclude '**/R$*.class'
            exclude '**/BuildConfig.class'
        }
    )

    // Execution data from unit tests
    executionData.setFrom(fileTree(layout.buildDirectory) {
        include '**/*.exec'
    })
}
